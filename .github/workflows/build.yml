name: build-duckdb

on:
  workflow_dispatch:

env:
  VSN: 1.5.5

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            variant: locked
            no_load: 1
          # - arch: amd64
          #   runner: ubuntu-26.04
          #   variant: unlocked
          #   no_load: 0
          # - arch: arm64
          #   runner: ubuntu-26.04-arm
          #   variant: locked
          #   no_load: 1
          # - arch: arm64
          #   runner: ubuntu-26.04-arm
          #   variant: unlocked
          #   no_load: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: /tmp/duckdb-image.tar
          key: ${{ matrix.arch }}-${{ matrix.variant }}-${{ env.VSN }}-${{ hashFiles('Dockerfile') }}

      - run: if [ -f /tmp/duckdb-image.tar ]; then docker load -i /tmp/duckdb-image.tar; fi

      - run: |
          docker build \
            --platform linux/${{ matrix.arch }} \
            --build-arg DISABLE_EXTENSION_LOAD=${{ matrix.no_load }} \
            --build-arg VERSION="$VSN" \
            -t duckdb-builder .

      - run: docker save duckdb-builder -o /tmp/duckdb-image.tar

      - run: ./extract.sh duckdb-builder

      - run: mv release.tar.gz libduckdb-v$VSN-linux-${{ matrix.arch }}-${{ matrix.variant }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: libduckdb-v${{ env.VSN }}-linux-${{ matrix.arch }}-${{ matrix.variant }}
          path: libduckdb-v${{ env.VSN }}-linux-${{ matrix.arch }}-${{ matrix.variant }}.tar.gz
          if-no-files-found: error

