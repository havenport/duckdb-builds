name: build-duckdb

on:
  push:
  workflow_dispatch:

env:
  VSN: 2.0.0

permissions:
  contents: read

jobs:
  resolve:
    name: resolve-duckdb-ref
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        run: |
          sha="$(git ls-remote https://github.com/duckdb/duckdb refs/heads/main | cut -f1)"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve duckdb/duckdb main SHA (got: '${sha}')" >&2
            exit 1
          fi
          echo "Building duckdb/duckdb@${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-16vcpu-ubuntu-2204
          - arch: arm64
            runner: blacksmith-32vcpu-ubuntu-2204-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: Dockerfile-${{ matrix.arch }}

      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=out
          build-args: |
            DUCKDB_REF=${{ needs.resolve.outputs.sha }}
            DUCKDB_VERSION=${{ env.VSN }}

      - run: docker buildx prune --force --max-used-space 20gb

      - run: mv out/release.tar.gz libduckdb-v$VSN-linux-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: libduckdb-v${{ env.VSN }}-linux-${{ matrix.arch }}
          path: libduckdb-v${{ env.VSN }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: [build, resolve]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: libduckdb-v${{ env.VSN }}-linux-*
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          DUCKDB_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          shopt -s nullglob
          assets=(artifacts/*.tar.gz)
          if [ "${#assets[@]}" -ne 2 ]; then
            echo "Expected two release archives, found ${#assets[@]}." >&2
            exit 1
          fi

          tag="v${VSN}-nightly"
          notes="Nightly build of DuckDB v${VSN} (in development), built from duckdb/duckdb@${DUCKDB_SHA}. libduckdb.so with extensions for Linux AMD64 and ARM64. This release is overwritten on every build."
          if gh release view "${tag}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber --repo "${REPOSITORY}"
            gh release edit "${tag}" --repo "${REPOSITORY}" --notes "${notes}"
          else
            gh release create "${tag}" "${assets[@]}" \
              --repo "${REPOSITORY}" \
              --target "${TARGET}" \
              --prerelease \
              --title "DuckDB v${VSN} (nightly)" \
              --notes "${notes}"
          fi
