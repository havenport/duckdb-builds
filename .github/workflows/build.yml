name: build-duckdb

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VSN: 2.0.0

permissions:
  contents: read

jobs:
  resolve:
    name: resolve-duckdb-ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        run: |
          sha="$(git ls-remote https://github.com/duckdb/duckdb refs/heads/main | cut -f1)"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve duckdb/duckdb main SHA (got: '${sha}')" >&2
            exit 1
          fi
          echo "Building duckdb/duckdb@${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-16vcpu-ubuntu-2204
          - arch: arm64
            runner: blacksmith-16vcpu-ubuntu-2204-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: Dockerfile-${{ matrix.arch }}

      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=out
          build-args: |
            DUCKDB_REF=${{ needs.resolve.outputs.sha }}
            DUCKDB_VERSION=${{ env.VSN }}

      - run: docker buildx prune --force --max-used-space 20gb

      - run: mv out/release.tar.gz libduckdb-v$VSN-linux-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: libduckdb-v${{ env.VSN }}-linux-${{ matrix.arch }}
          path: libduckdb-v${{ env.VSN }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  tests:
    name: tests
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pack the test corpus
        env:
          VERSION: ${{ env.VSN }}
          DUCKDB_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o duckdb-src.tar.gz \
            "https://github.com/duckdb/duckdb/archive/${DUCKDB_SHA}.tar.gz"
          mkdir duckdb-src
          tar xzf duckdb-src.tar.gz -C duckdb-src --strip-components=1

          # unzip directives reference archives as "data/storage/x.db.gz",
          # relative to the tree root, so both paths keep their layout.
          mkdir -p tests/test tests/data
          cp -r duckdb-src/test/sql tests/test/sql
          cp -r duckdb-src/data/storage tests/data/storage

          cat > tests/MANIFEST <<MANIFEST
          version=${VERSION}
          duckdb_ref=${DUCKDB_SHA}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          test_files=$(find tests/test/sql -name '*.test' | wc -l)
          archives=$(find tests/data -name '*.gz' | wc -l)
          MANIFEST

          tar -czf "duckdb-tests-v${VERSION}.tar.gz" -C tests .
          cat tests/MANIFEST
          ls -lh "duckdb-tests-v${VERSION}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: duckdb-tests-v${{ env.VSN }}
          path: duckdb-tests-v${{ env.VSN }}.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: [build, tests, resolve]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: "*-v${{ env.VSN }}*"
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          DUCKDB_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          shopt -s nullglob
          assets=(artifacts/*.tar.gz)
          if [ "${#assets[@]}" -ne 3 ]; then
            echo "Expected three release archives, found ${#assets[@]}." >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi

          ( cd artifacts && sha256sum *.tar.gz > sha256sums.txt )
          assets+=(artifacts/sha256sums.txt)
          tag="v${VSN}-nightly"
          notes="Nightly build of DuckDB v${VSN} (in development), built from duckdb/duckdb@${DUCKDB_SHA}. libduckdb.so with extensions and headers for Linux AMD64 and ARM64, plus duckdb-tests-v${VSN}.tar.gz holding the SQL logic corpus from the same commit. This release is overwritten on every build."
          if gh release view "${tag}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber --repo "${REPOSITORY}"
            gh release edit "${tag}" --repo "${REPOSITORY}" --notes "${notes}"
          else
            gh release create "${tag}" "${assets[@]}" \
              --repo "${REPOSITORY}" \
              --target "${TARGET}" \
              --prerelease \
              --title "DuckDB v${VSN} (nightly)" \
              --notes "${notes}"
          fi
