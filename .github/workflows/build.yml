name: build-duckdb

on:
  push:
  workflow_dispatch:

env:
  VSN: 1.5.5

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-16vcpu-ubuntu-2204
          - arch: arm64
            runner: blacksmith-32vcpu-ubuntu-2204-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: Dockerfile-${{ matrix.arch }}

      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=out
          build-args: |
            VERSION=${{ env.VSN }}

      - run: docker buildx prune --force --max-used-space 20gb

      - run: mv out/release.tar.gz libduckdb-v$VSN-linux-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: libduckdb-v${{ env.VSN }}-linux-${{ matrix.arch }}
          path: libduckdb-v${{ env.VSN }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: libduckdb-v${{ env.VSN }}-linux-*
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          shopt -s nullglob
          assets=(artifacts/*.tar.gz)
          if [ "${#assets[@]}" -ne 2 ]; then
            echo "Expected two release archives, found ${#assets[@]}." >&2
            exit 1
          fi

          tag="v${VSN}"
          if gh release view "${tag}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber --repo "${REPOSITORY}"
          else
            gh release create "${tag}" "${assets[@]}" \
              --repo "${REPOSITORY}" \
              --target "${TARGET}" \
              --title "DuckDB v${VSN}" \
              --notes "libduckdb.so with extensions for Linux AMD64 and ARM64"
          fi
