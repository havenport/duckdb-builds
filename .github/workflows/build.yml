name: build-duckdb

on:
  push:
  workflow_dispatch:

env:
  VSN: 1.5.5

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        include:
          - arch: amd64
            # runner: ubuntu-26.04
            runner: blacksmith-16vcpu-ubuntu-2204
            variant: locked
            no_load: 1
          - arch: amd64
            # runner: ubuntu-26.04
            runner: blacksmith-16vcpu-ubuntu-2204
            variant: unlocked
            no_load: 0
          - arch: arm64
            # runner: ubuntu-26.04-arm
            runner: blacksmith-16vcpu-ubuntu-2204-arm
            variant: locked
            no_load: 1
          - arch: arm64
            # runner: ubuntu-26.04-arm
            runner: blacksmith-16vcpu-ubuntu-2204-arm
            variant: unlocked
            no_load: 0
    steps:
      - uses: actions/checkout@v7

      # - uses: docker/setup-buildx-action@v4
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: Dockerfile

      # - uses: docker/build-push-action@v7
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          load: true
          push: false
          platforms: linux/${{ matrix.arch }}
          tags: duckdb-builder
          build-args: |
            DISABLE_EXTENSION_LOAD=${{ matrix.no_load }}
            VERSION=${{ env.VSN }}
          # cache-from: type=gha,scope=duckdb-${{ matrix.arch }}-${{ matrix.variant }}
          # cache-to: type=gha,mode=max,scope=duckdb-${{ matrix.arch }}-${{ matrix.variant }}

      - run: ./extract.sh duckdb-builder

      - run: mv release.tar.gz libduckdb-v$VSN-linux-${{ matrix.arch }}-${{ matrix.variant }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: libduckdb-v${{ env.VSN }}-linux-${{ matrix.arch }}-${{ matrix.variant }}
          path: libduckdb-v${{ env.VSN }}-linux-${{ matrix.arch }}-${{ matrix.variant }}.tar.gz
          if-no-files-found: error

